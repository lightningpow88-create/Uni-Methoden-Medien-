<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Die Kalorien-Linie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
:root {
  --bg: #E6EDE8; --board: #F8FBF8; --ink: #16251E; --muted: #56665E;
  --card: #FFFFFF; --plate: #EEF4F0; --edge: #CFDAD3;
  --energy-lo: #FFEDB3; --energy-hi: #E8590C; --accent: #C2410C;
  --good: #2B8A3E; --good-soft: #E1F3E4; --bad: #A61E4D; --bad-soft: #FBE3EC;
  --right: #0B7285; --right-soft: #DDF1F4; --wrong: #C92A2A;
  --left: #1971C2; --left-soft: #E3EEFB; --rgt: #C2410C; --rgt-soft: #FDEADF;
  --shadow: rgba(22,37,30,.18); --overlay: rgba(14,24,19,.55);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Verdana, system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
#wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }
#stage { position: absolute; left: 0; top: 0; width: 1600px; height: 900px; transform-origin: 0 0;
  background: var(--board); border-radius: 24px; box-shadow: 0 10px 40px var(--shadow); overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; }
button { font-family: inherit; color: inherit; cursor: pointer; }
img { display: block; max-width: 100%; pointer-events: none; }

header { position: absolute; left: 40px; right: 40px; top: 12px; height: 60px; display: flex; align-items: center; gap: 24px; }
header h1 { font-family: var(--font-display); font-weight: 800; font-size: 42px; margin: 0; letter-spacing: -.5px; }
header .q { font-size: 22px; color: var(--muted); flex: 1; }
.tool { border: 2px solid var(--edge); background: var(--card); border-radius: 14px; padding: 10px 16px; font-size: 18px; font-weight: 700; }
.tool:hover { border-color: var(--ink); }

/* Energielinie mit Beschriftung an den Enden */
#line { position: absolute; left: 50px; right: 50px; top: 412px; height: 34px; border-radius: 17px;
  background: linear-gradient(90deg, var(--energy-lo), var(--energy-hi)); display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
  font-size: 18px; font-weight: 700; }
#line span:first-child { color: #7A5A00; } #line span:last-child { color: #fff; }
.zone { position: absolute; top: 84px; height: 690px; width: 744px; border-radius: 22px; opacity: 0; transition: opacity .2s; pointer-events: none;
  display: flex; align-items: flex-start; justify-content: center; padding-top: 12px; font-family: var(--font-display); font-weight: 800; font-size: 26px; }
.zone.l { left: 24px; background: var(--left-soft); color: var(--left); }
.zone.r { right: 24px; background: var(--rgt-soft); color: var(--rgt); }

#anchor { position: absolute; left: 700px; top: 324px; width: 200px; height: 210px; background: var(--card); border: 4px solid var(--ink);
  border-radius: 22px; box-shadow: 0 8px 24px var(--shadow); display: flex; flex-direction: column; align-items: center; padding: 10px; z-index: 3; }
#anchor img { width: 112px; height: 100px; }
#anchor .n { font-family: var(--font-display); font-weight: 800; font-size: 24px; }
#anchor .k { font-size: 28px; font-weight: 700; color: var(--accent); }

/* Karten */
.lc { position: absolute; width: 166px; height: 164px; overflow: hidden; background: var(--card); border: 3px solid var(--edge); border-radius: 18px; padding: 6px 8px 8px;
  box-shadow: 0 6px 18px var(--shadow); text-align: center; z-index: 4; cursor: grab; touch-action: none; }
.lc.anim { transition: left .7s cubic-bezier(.2,.8,.2,1), top .7s cubic-bezier(.2,.8,.2,1); }
.lc.drag { cursor: grabbing; box-shadow: 0 16px 40px rgba(0,0,0,.3); z-index: 8; transform: scale(1.05); }
.lc.new { border-color: var(--accent); border-width: 4px; animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 10px rgba(194,65,12,.18), 0 6px 18px var(--shadow); } }
.lc img { width: 54px; height: 44px; margin: 0 auto; }
.lc .n { font-weight: 700; font-size: 15px; line-height: 1.12; height: 34px; display: flex; align-items: center; justify-content: center; }
.lc .m { font-size: 13px; color: var(--muted); line-height: 1.15; height: 30px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.lc .k { font-family: var(--font-display); font-weight: 800; font-size: 26px; color: var(--accent); margin-top: 1px; }
.lc .k span { font-size: 15px; font-family: var(--font-body); color: var(--muted); }
.lc .k.q { color: var(--muted); }
.lc .tag { margin-top: 4px; font-size: 13px; font-weight: 700; border-radius: 999px; padding: 3px 6px; }
.lc .tag.g { background: var(--good-soft); color: var(--good); } .lc .tag.b { background: var(--bad-soft); color: var(--bad); }
.lc .tag.w { background: var(--plate); color: var(--muted); }
.lc.done { cursor: pointer; }
.lc.flip { animation: flip .6s ease-in-out; }
@keyframes flip { 0% { transform: perspective(600px) rotateY(0); } 50% { transform: perspective(600px) rotateY(90deg); } 100% { transform: perspective(600px) rotateY(0); } }
.lc.ok { border-color: var(--right); border-width: 4px; } .lc.no { border-color: var(--wrong); border-width: 4px; }
.lc { overflow: visible; }
.mark { position: absolute; top: -14px; right: -14px; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 22px; color: #fff; box-shadow: 0 3px 8px var(--shadow); }
.lc.ok .mark { background: var(--right); } .lc.no .mark { background: var(--wrong); }
.lc.g { border-color: var(--good); } .lc.b { border-color: var(--bad); }
.stem { position: absolute; width: 4px; background: var(--ink); opacity: .35; border-radius: 2px; transition: all .7s cubic-bezier(.2,.8,.2,1); }
.dot { position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); top: 420px; margin-left: -9px; transition: left .7s cubic-bezier(.2,.8,.2,1); z-index: 1; }

/* Steuerung unten */
#dock { position: absolute; left: 40px; right: 40px; bottom: 26px; height: 80px; display: flex; align-items: center; justify-content: space-between; pointer-events: none; }
#dock > * { pointer-events: auto; }
.cta { font-family: var(--font-display); font-weight: 800; font-size: 28px; border: 0; border-radius: 20px; padding: 16px 30px; background: var(--accent); color: #fff; box-shadow: 0 8px 20px var(--shadow); }
.cta.dark { background: var(--ink); color: var(--board); }
.cta.arr { background: var(--right); color: #fff; }
.cta:disabled { background: var(--edge); color: var(--muted); box-shadow: none; cursor: default; }
.dl { display: flex; align-items: center; gap: 16px; }
#count { font-size: 19px; color: var(--muted); font-weight: 700; }
#hintdrag { position: absolute; left: 50%; bottom: 196px; transform: translateX(-50%); font-size: 22px; font-weight: 700; color: var(--accent); }

/* Overlay */
#ov { position: absolute; inset: 0; background: var(--overlay); display: flex; align-items: center; justify-content: center; z-index: 10; }
.panel { background: var(--board); border-radius: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.35); padding: 40px 48px; }
.big { width: 1360px; display: grid; grid-template-columns: 430px 1fr; gap: 48px; align-items: stretch; }
.bigcard { background: var(--card); border: 4px solid var(--edge); border-radius: 26px; padding: 26px; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.bigcard img { width: 260px; height: 230px; }
.bigcard .n { font-family: var(--font-display); font-weight: 800; font-size: 40px; line-height: 1.1; margin-top: 10px; }
.bigcard .p { font-size: 22px; color: var(--muted); margin-top: 8px; }
.bigcard.g { border-color: var(--good); } .bigcard.b { border-color: var(--bad); }
.side { display: flex; flex-direction: column; justify-content: center; align-items: flex-start; }
.side h2 { font-family: var(--font-display); font-weight: 800; font-size: 44px; margin: 0 0 10px; line-height: 1.1; }
.verdict { display: inline-flex; align-items: center; gap: 12px; font-family: var(--font-display); font-weight: 800; font-size: 30px; border-radius: 16px; padding: 10px 20px; margin-bottom: 16px; }
.verdict.ok { background: var(--right-soft); color: var(--right); } .verdict.no { background: var(--bad-soft); color: var(--wrong); }
.kc { font-family: var(--font-display); font-weight: 800; font-size: 110px; color: var(--accent); line-height: 1; }
.kc span { font-size: 32px; }
.cmp { font-size: 30px; margin: 12px 0 10px; }
.calc { font-size: 20px; color: var(--muted); background: var(--plate); border-radius: 14px; padding: 12px 16px; margin: 0 0 16px; }
.dge { border-radius: 16px; padding: 14px 18px; font-size: 22px; line-height: 1.35; }
.dge.g { background: var(--good-soft); } .dge.b { background: var(--bad-soft); }
.dge b { display: block; font-size: 24px; margin-bottom: 4px; }
.dge.g b { color: var(--good); } .dge.b b { color: var(--bad); }
.go { margin-top: 24px; border: 0; border-radius: 18px; padding: 18px 30px; font-family: var(--font-display); font-weight: 800; font-size: 28px; background: var(--ink); color: var(--board); }
.go.alt { background: var(--card); color: var(--ink); border: 3px solid var(--ink); margin-left: 14px; }
.intro { width: 1080px; }
.intro h2 { font-family: var(--font-display); font-weight: 800; font-size: 52px; margin: 0 0 18px; }
.intro ol { font-size: 28px; line-height: 1.5; margin: 0; padding-left: 36px; }
.intro li { margin-bottom: 8px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <header>
    <h1>Die Kalorien-Linie</h1>
    <div class="q">Vor oder nach dem Käsebrötchen?</div>
    <button class="tool" id="help" type="button">Spielregeln</button>
    <button class="tool" id="restart" type="button">Neu starten</button>
    <button class="tool" id="fs" type="button">Vollbild</button>
  </header>
  <div class="zone l" id="zl">davor: weniger Energie</div>
  <div class="zone r" id="zr">danach: mehr Energie</div>
  <div id="line"><span>← weniger Energie</span><span>mehr Energie →</span></div>
  <div id="layer"></div>
  <div id="anchor">
    <img id="anchor-img" alt="">
    <div class="n">Käsebrötchen</div>
    <div class="k">300 kcal</div>
  </div>
  <div id="hintdrag" hidden>Karte an die Linie ziehen</div>
  <div id="dock">
    <div class="dl"><button class="cta" id="draw" type="button">Karte aufdecken</button><span id="count"></span></div>
    <button class="cta dark" id="solve" type="button">Auflösen</button>
  </div>
  <div id="ov" hidden></div>
</div></div>

 fill=\"#C1694F\"/></g></svg>", "pingui": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 36 36\"><g transform=\"rotate(-10 18 18)\"><rect x=\"5\" y=\"20\" width=\"26\" height=\"7\" rx=\"2\" fill=\"#6B3A1F\"/><rect x=\"5\" y=\"15\" width=\"26\" height=\"5.5\" fill=\"#FFFDF5\"/><rect x=\"5\" y=\"10\" width=\"26\" height=\"5.5\" fill=\"#6B3A1F\"/><path d=\"M4.5 10.5c0-2 1.2-3 3-3h21c1.8 0 3 1 3 3v1.2c-1.6 1.1-2.4-.6-3.6.4-1.3 1.1-2.3-.5-3.6.4s-2.2-.5-3.5.4-2.3-.4-3.6.4-2.3-.4-3.5.4-2.3-.4-3.6.4c-1.4.9-2.3-.4-3.6-.1z\" fill=\"#3E1F0E\"/><path d=\"M8 9.5l3 0M14 9.5l3 0M20 9.5l3 0M26 9.5l2 0\" stroke=\"#8A4B38\" stroke-width=\"1\" stroke-linecap=\"round\"/><rect x=\"5\" y=\"20\" width=\"26\" height=\"1\" fill=\"#E9DCC3\"/></g></svg>", "schokocroissant": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 36 36\"><g transform=\"translate(1 2) scale(0.9)\"><path fill=\"#F4900C\" d=\"M11.569 35.41c-2.223-.63-5.362-4.11-6.86-7.331-.183-.391-1.101-.673-1.265-1.084C.953 20.775.637 12.54 6.342 6.834 12.751.425 20.537-.295 26.817 1.757c.45.147.837 1.114 1.286 1.199 5.917 1.115 8.322 7.549 5.759 6.816-1.199-.342-2.657-.557-3.814-.428-.437.049-1.051.892-1.544.962-.767.11-2.64.212-3.564.305-9.159.916-12.395 6.971-12.811 14.256-.046.808-.617.623-.73 1.283-.344 1.992 1.089 4.884 1.772 6.939.594 1.794.619 2.951-1.602 2.321z\"/><path fill=\"#DB7803\" d=\"M4.128 9.652c-1.439 2.333-2.158 4.906-2.333 7.505 2.615-1.499 6.334-2.652 12.393-.18a11.568 11.568 0 0 1 3.124-3.624c-.992-.932-1.992-1.645-2.742-1.822-2.481-.588-7.17-2.213-10.442-1.879zm-.251 17.769c.324.215.719.416.832.658.032.069.069.139.103.209 1.92-1.11 4.42-1.707 6.553-1.642.006-.167.005-.339.032-.496.095-.552.506-.52.667-.965-4.887-1.059-6.75.812-8.187 2.236zM28.899 3.157c-.26-.074-.52-.148-.796-.2-.169-.032-.33-.19-.489-.382.918 2.123 1.899 5.032 1.024 7.689.467-.178 1.011-.875 1.409-.919.067-.007.143-.003.211-.008.206-1.704-.284-4.207-1.359-6.18z\"/><path fill=\"#FFAC33\" d=\"M2.038 14.915C1.084 11.663 2.419 2.2 const src = id => "data:image/svg+xml;charset=utf-8," + encodeURIComponent(IMG[id]);
const ANCHOR = 300, CW = 166, CH = 164;


// Die ersten 6 Karten tragen die Kernaussage, die 5 Reservekarten vertiefen sie.
const MAIN = [
  { id: "knoppers", short: "1 Stück (25 g)", name: "Knoppers", portion: "1 Waffelschnitte (25 g)", kcal: 137 },
  { id: "avocado", short: "2 Scheiben, ½ Avocado", name: "Avocado-Brot", portion: "2 Scheiben Vollkornbrot mit ½ Avocado", kcal: 470 },
  { id: "pingui", short: "1 Stück (30 g)", name: "Kinder Pingui", portion: "1 Stück (30 g)", kcal: 135 },
  { id: "hummus", short: "1 Brötchen, 50 g Hummus", name: "Vollkornbrötchen mit Hummus", portion: "1 Brötchen mit Hummus und Gemüse", kcal: 330 },
  { id: "muesli", short: "50 g Flocken, 200 ml Milch", name: "Müsli mit Milch und Banane", portion: "50 g Haferflocken, 200 ml Milch, ½ Banane", kcal: 340 },
  { id: "schokocroissant", short: "1 Stück (ca. 75 g)", name: "Schokocroissant", portion: "1 Stück vom Bäcker (ca. 75 g)", kcal: 250 },
];
const RESERVE = [
  { id: "erdnuss", short: "2 Scheiben, 1 Banane", name: "Erdnussmus-Brot mit Banane", portion: "2 Scheiben Vollkornbrot, 1 Banane", kcal: 570, dge: true,
    calc: "Vollkornbrot ca. 210 kcal + Erdnussmus (40 g) ca. 250 kcal + 1 Banane ca. 110 kcal",
    why: "Fast doppelt so viel Energie wie das Käsebrötchen und trotzdem empfehlenswert: Vollkorn, Obst und Nüsse liefern Ballaststoffe und gesunde Fette." },
  { id: "energy", short: "1 Dose (0,5 l)", name: "Energy-Drink", portion: "1 Dose (0,5 l)", kcal: 230, dge: false,
    calc: "0,5 l Energy-Drink haben ca. 230 kcal und ca. 55 g Zucker, so viel wie 18 Würfel Zucker.",
    why: "Sehr viel Zucker und Koffein, keine Nährstoffe. Für Jugendliche nicht empfohlen." },
  { id: "nuesse", short: "1 Handvoll (25 g)", name: "Nüsse", portion: "1 kleine Handvoll (25 g)", kcal: 160, dge: true,
    calc: "25 g Nüsse haben ca. 160 kcal.",
    why: "Eine kleine Menge mit viel Energie, aber mit gesunden Fetten. Die DGE empfiehlt jeden Tag eine kleine Handvoll." },
  { id: "cerealien", short: "80 g, 300 ml Milch", name: "Schoko-Cerealien mit Milch", portion: "1 große Schüssel (80 g) mit 300 ml Milch", kcal: 500, dge: false,
    calc: "Schoko-Cerealien (80 g) ca. 310 kcal + Vollmilch (300 ml) ca. 190 kcal",
    why: "Viel Zucker (ca. 20 g) und kaum Vollkorn. Besser ist Müsli ohne Zucker." },
  { id: "cola", short: "1 Flasche (0,5 l)", name: "Cola", portion: "1 Flasche (0,5 l)", kcal: 210 },
];

const $ = s => document.querySelector(s);
const stage = $("#stage"), ov = $("#ov"), layer = $("#layer");
$("#anchor-img").src = src("kaese");

let st, scale = 1;
function reset() {
  st = { deck: MAIN.slice(), reserveUsed: false, items: [], fresh: null, endShown: false };
  layer.innerHTML = ""; closeOv(); hl(null); update(); showIntro();
}

function fit() {
  const w = $("#wrap").clientWidth, h = $("#wrap").clientHeight;
  scale = Math.min(w / 1600, h / 900);
  stage.style.transform = `translate(${(w - 1600 * scale) / 2}px, ${(h - 900 * scale) / 2}px) scale(${scale})`;
}
addEventListener("resize", fit);

/* Aufgelöste Karten an ihre kcal-Stelle, in Bahnen über und unter der Linie */
const X0 = 220, X1 = 1380;
const xOf = k => X0 + (k / 600) * (X1 - X0);
const LANES = [ { top: 242, up: true }, { top: 456, up: false }, { top: 72, up: true }, { top: 626, up: false } ];
const GAP = 12;
function layout() {
  const done = st.items.filter(i => i.solved).sort((a, b) => a.f.kcal - b.f.kcal);
  const ends = LANES.map(() => -1e9);
  const aL = 700 - GAP, aR = 900 + GAP;
  done.forEach(it => {
    const cx = xOf(it.f.kcal);
    let best = null;
    LANES.forEach((ln, i) => {
      let left = Math.max(cx - CW / 2, ends[i] + GAP);
      if (i < 2 && left + CW > aL && left < aR) left = cx < 800 ? Math.min(left, aL - CW) : Math.max(left, aR);
      if (left < ends[i] + GAP) return;
      left = Math.min(Math.max(left, 30), 1600 - 30 - CW);
      const cost = Math.abs(left + CW / 2 - cx) + i * 40;
      if (!best || cost < best.cost) best = { i, left, cost };
    });
    if (!best) best = { i: 3, left: Math.min(ends[3] + GAP, 1600 - 30 - CW) };
    ends[best.i] = best.left + CW;
    const ln = LANES[best.i];
    it.el.style.left = best.left + "px"; it.el.style.top = ln.top + "px";
    it.dot.style.left = cx + "px";
    it.stem.style.left = (best.left + CW / 2 - 2) + "px";
    if (ln.up) { it.stem.style.top = (ln.top + CH) + "px"; it.stem.style.height = Math.max(0, 420 - ln.top - CH) + "px"; }
    else { it.stem.style.top = "440px"; it.stem.style.height = Math.max(0, ln.top - 440) + "px"; }
  });
}

function cardHtml(it) {
  const f = it.f;
  const head = `<img alt="" src="${src(f.id)}"><div class="n">${f.name}</div><div class="m">${f.short}</div>`;
  if (!it.solved) return head + `<div class="k q">? <span>kcal</span></div>`;
  return head + `<div class="k">${f.kcal} <span>kcal</span></div>`;
}

/* Ziehen mit Maus, Stift oder Finger */
function makeDraggable(it) {
  const el = it.el;
  el.addEventListener("pointerdown", e => {
    if (it.solved) return;
    e.preventDefault();
    el.setPointerCapture(e.pointerId);
    const r = stage.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY, ox = parseFloat(el.style.left), oy = parseFloat(el.style.top);
    let moved = false;
    el.classList.remove("anim"); el.classList.add("drag");
    const move = ev => {
      const dx = (ev.clientX - sx) / scale, dy = (ev.clientY - sy) / scale;
      if (Math.abs(dx) + Math.abs(dy) > 6) moved = true;
      const x = Math.min(Math.max(ox + dx, 10), 1600 - CW - 10), y = Math.min(Math.max(oy + dy, 76), 900 - CH - 10);
      el.style.left = x + "px"; el.style.top = y + "px";
      hl(x + CW / 2 < 800 ? "L" : "R");
    };
    const up = () => {
      el.removeEventListener("pointermove", move); el.removeEventListener("pointerup", up); el.removeEventListener("pointercancel", up);
      el.classList.remove("drag"); hl(null);
      if (!moved) return;
      // abgelegt: auf der Seite des Käsebrötchens, auf der die Kartenmitte liegt
      let y = parseFloat(el.style.top);
      if (y > 900 - 196 - CH) { y = 900 - 196 - CH; el.classList.add("anim"); el.style.top = y + "px"; }
      it.guess = parseFloat(el.style.left) + CW / 2 < 800 ? "L" : "R";
      it.placed = true;
      if (st.fresh === it) { st.fresh = null; el.classList.remove("new"); }
      update();
    };
    el.addEventListener("pointermove", move); el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
  });
  el.addEventListener("click", () => { if (it.solved) showResult(it, true); });
}

function drawCard() {
  if (st.fresh || st.busy || (st.toArrange && st.toArrange.length)) return;
  if (!st.deck.length) {
    if (st.reserveUsed) return;
    st.deck = RESERVE.slice(); st.reserveUsed = true;
  }
  const f = st.deck.shift();
  const el = document.createElement("div");
  el.className = "lc new";
  const stem = document.createElement("div"); stem.className = "stem"; stem.hidden = true;
  const dot = document.createElement("div"); dot.className = "dot"; dot.hidden = true;
  const it = { f, el, stem, dot, solved: false, placed: false, guess: null };
  el.innerHTML = cardHtml(it);
  el.style.left = (800 - CW / 2) + "px"; el.style.top = (900 - 196 - CH + 20) + "px";
  layer.append(stem, dot, el);
  st.items.push(it); st.fresh = it;
  makeDraggable(it);
  update();
}

function solveNext() {
  // Alle gelegten Karten gleichzeitig umdrehen, falsche markieren, dann alle an ihren Platz
  const open = st.items.filter(i => i.placed && !i.solved);
  if (!open.length || st.busy) return;
  st.busy = true; update();
  open.forEach((it, n) => {
    const truth = it.f.kcal < ANCHOR ? "L" : "R";
    it.correct = it.guess === truth;
    setTimeout(() => {
      it.el.classList.remove("anim");
      it.el.classList.add("flip");
      setTimeout(() => {
        it.solved = true;
        it.el.className = "lc done flip " + (it.correct ? "ok" : "no");
        it.el.innerHTML = cardHtml(it) + `<div class="mark">${it.correct ? "✓" : "✗"}</div>`;
      }, 300);
    }, n * 120);
  });
  setTimeout(() => { st.busy = false; st.toArrange = open; update(); }, open.length * 120 + 700);
}

function arrange() {
  const open = st.toArrange || [];
  if (!open.length || st.busy) return;
  st.busy = true; st.toArrange = null; update();
  {
    open.forEach(it => {
      it.el.classList.remove("flip"); it.el.classList.add("anim");
      it.stem.hidden = false; it.dot.hidden = false;
      it.dot.style.left = (parseFloat(it.el.style.left) + CW / 2) + "px";
    });
    requestAnimationFrame(() => requestAnimationFrame(layout));
    setTimeout(() => { st.busy = false; update(); }, 900);
  }
}

function update() {
  const left = st.deck.length;
  const draw = $("#draw");
  if (st.fresh || st.busy || (st.toArrange && st.toArrange.length)) { draw.disabled = true; draw.textContent = "Karte aufdecken"; }
  else if (left) { draw.disabled = false; draw.textContent = "Karte aufdecken"; }
  else if (!st.reserveUsed) { draw.disabled = false; draw.textContent = "Reservekarte aufdecken"; }
  else { draw.disabled = true; draw.textContent = "Alle Karten gespielt"; }
  $("#count").textContent = left ? (st.reserveUsed ? `noch ${left} Reserve` : `noch ${left} + 5 Reserve`) : st.reserveUsed ? "" : "noch 5 Reserve";
  const open = st.items.filter(i => i.placed && !i.solved).length;
  const sb = $("#solve");
  if (st.toArrange && st.toArrange.length) { sb.disabled = st.busy; sb.textContent = "Richtig anordnen"; sb.classList.add("arr"); }
  else { sb.disabled = !open || st.busy; sb.textContent = open > 1 ? `Auflösen (${open})` : "Auflösen"; sb.classList.remove("arr"); }
  $("#hintdrag").hidden = !st.fresh;
}

function hl(side) {
  $("#zl").style.opacity = side === "L" ? 1 : 0;
  $("#zr").style.opacity = side === "R" ? 1 : 0;
}
function openOv(html) { ov.innerHTML = html; ov.hidden = false; }
function closeOv() { ov.hidden = true; ov.innerHTML = ""; }

function showIntro() {
  openOv(`<div class="panel intro">
    <h2>So spielen wir</h2>
    <ol>
      <li>Eine Karte wird aufgedeckt.</li>
      <li>Die Klasse stimmt ab: Kommt das Essen <b>vor</b> das Käsebrötchen (weniger Energie) oder <b>danach</b> (mehr Energie)?</li>
      <li>Die Karte wird an die Linie gelegt. Wenn alle Karten liegen: „Auflösen“ dreht alle Karten um. „Richtig anordnen“ schiebt sie an ihren Platz.</li>
    </ol>
    <button class="go" type="button" data-a="close">Los geht's</button>
  </div>`);
}

function showResult(it, review) {
  const f = it.f, truth = f.kcal < ANCHOR ? "L" : "R", diff = f.kcal - ANCHOR;
  const cmp = diff === 0 ? "genau so viel wie das Käsebrötchen" : `${Math.abs(diff)} kcal ${diff < 0 ? "weniger" : "mehr"} als das Käsebrötchen`;
  const verdict = review ? "" : it.guess === truth ? `<div class="verdict ok">✓ Richtig gelegt</div>` : `<div class="verdict no">✗ Liegt auf der falschen Seite</div>`;
  openOv(`<div class="panel big">
    <div class="bigcard"><img alt="" src="${src(f.id)}"><div class="n">${f.name}</div><div class="p">${f.portion}</div></div>
    <div class="side">
      ${verdict}
      <div class="kc">ca. ${f.kcal} <span>kcal</span></div>
      <div class="cmp">${cmp}</div>
      <button class="go" type="button" data-a="${review ? "close" : "solved"}">${review ? "Schließen" : "An die richtige Stelle"}</button>
    </div>
  </div>`);
  st.pending = review ? null : it;
}

function finishSolve() {
  const it = st.pending; st.pending = null; closeOv();
  if (!it) return;
  it.solved = true;
  it.el.className = "lc anim done";
  it.el.innerHTML = cardHtml(it);
  it.stem.hidden = false; it.dot.hidden = false;
  it.dot.style.left = (parseFloat(it.el.style.left) + CW / 2) + "px";
  requestAnimationFrame(() => requestAnimationFrame(layout));
  update();
  const allDone = !st.fresh && !st.deck.length && st.items.every(i => i.solved);
  if (allDone && !st.reserveUsed) setTimeout(() => openOv(`<div class="panel intro">
    <h2>Alle 5 Karten liegen!</h2>
    <ol style="list-style:none;padding:0"><li>Weiter mit den Reservekarten oder zurück zur Linie?</li></ol>
    <button class="go" type="button" data-a="close">Zur Linie</button>
    <button class="go alt" type="button" data-a="reserve">Reservekarten spielen</button>
  </div>`), 900);
}

ov.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if (!b) { if (e.target === ov && !st.pending) closeOv(); return; }
  const a = b.dataset.a;
  if (a === "close") closeOv();
  else if (a === "solved") finishSolve();
  else if (a === "reserve") { closeOv(); drawCard(); }
});

$("#draw").addEventListener("click", drawCard);
$("#solve").addEventListener("click", () => (st.toArrange && st.toArrange.length ? arrange() : solveNext()));
$("#help").addEventListener("click", showIntro);
$("#restart").addEventListener("click", () => { if (confirm("Spiel neu starten?")) reset(); });
$("#fs").addEventListener("click", () => {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => {});
});
addEventListener("keydown", e => { if (e.key === "Escape" && !ov.hidden && !st.pending) closeOv(); });

fit(); reset();
</script>
</body>
</html>
