<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Die Kalorien-Linie</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: one fixed 16:9 board (1600x900) scaled to the screen - an energy line across the middle,
   the Käsebrötchen pinned at its center, cards zigzag above/below; dock below: Zug-Panel | Stapel | Punkte. */
:root {
  --bg: #E6EDE8;
  --board: #F8FBF8;
  --grid: #E3EBE5;
  --ink: #16251E;
  --muted: #56665E;
  --card: #FFFFFF;
  --plate: #EEF4F0;
  --edge: #CFDAD3;
  --energy-lo: #FFEDB3;
  --energy-hi: #E8590C;
  --accent: #C2410C;
  --good: #2B8A3E;
  --good-soft: #E1F3E4;
  --bad: #A61E4D;
  --bad-soft: #FBE3EC;
  --right: #0B7285;
  --wrong: #C92A2A;
  --gold: #F08C00;
  --back-a: #FFD8A8;
  --back-b: #FFC078;
  --shadow: rgba(22, 37, 30, .18);
  --overlay: rgba(14, 24, 19, .55);
  --font-display: "Bricolage Grotesque", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", Verdana, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1512; --board: #15201B; --grid: #1C2923; --ink: #E5EEE9; --muted: #9BAEA4;
    --card: #22302A; --plate: #2A3A33; --edge: #34463D; --energy-lo: #5C4510; --energy-hi: #FF7A2E;
    --accent: #FF9A5C; --good: #5CCB72; --good-soft: #1C3523; --bad: #F27BA5; --bad-soft: #3B1E2B;
    --right: #3BC9DB; --wrong: #FF6B6B; --gold: #FFC041; --back-a: #6B3A12; --back-b: #8A4A16;
    --shadow: rgba(0, 0, 0, .5); --overlay: rgba(0, 0, 0, .62);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1512; --board: #15201B; --grid: #1C2923; --ink: #E5EEE9; --muted: #9BAEA4;
  --card: #22302A; --plate: #2A3A33; --edge: #34463D; --energy-lo: #5C4510; --energy-hi: #FF7A2E;
  --accent: #FF9A5C; --good: #5CCB72; --good-soft: #1C3523; --bad: #F27BA5; --bad-soft: #3B1E2B;
  --right: #3BC9DB; --wrong: #FF6B6B; --gold: #FFC041; --back-a: #6B3A12; --back-b: #8A4A16;
  --shadow: rgba(0, 0, 0, .5); --overlay: rgba(0, 0, 0, .62);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden;
}
#wrap { position: relative; width: 100%; height: 100%; overflow: hidden; }
#stage {
  position: absolute; left: 0; top: 0; width: 1600px; height: 900px;
  transform-origin: 0 0; touch-action: none; user-select: none; -webkit-user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .anchor:focus-visible { outline: 3px solid var(--energy-hi); outline-offset: 3px; }
.muted { color: var(--muted); }

/* ---------- header ---------- */
.top { position: absolute; left: 16px; right: 16px; top: 0; height: 72px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.brand { display: flex; align-items: baseline; gap: 16px; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 36px; letter-spacing: -.5px; line-height: 1; }
.brand p { margin: 0; font-size: 19px; color: var(--muted); }
.tools { display: flex; align-items: center; gap: 10px; }
.status { font-size: 18px; color: var(--muted); padding: 0 6px; font-variant-numeric: tabular-nums; }
.status b { color: var(--ink); font-family: var(--font-display); font-size: 22px; }
.btn {
  border: 2px solid var(--edge); background: var(--card); border-radius: 12px;
  padding: 9px 14px; font-size: 16px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
}
.btn:hover:not(:disabled) { border-color: var(--ink); }
.btn:disabled { opacity: .42; cursor: not-allowed; }
.btn svg { width: 19px; height: 19px; flex: none; }
.btn.primary { background: var(--ink); color: var(--board); border-color: var(--ink); }
.btn.big { font-size: 20px; padding: 12px 22px; border-radius: 14px; }
.btn.alarm { background: var(--wrong); color: #fff; border-color: var(--wrong); }
.btn.go { background: var(--energy-hi); color: #fff; border-color: var(--energy-hi); }

/* ---------- board ---------- */
.board {
  position: absolute; left: 16px; right: 16px; top: 80px; height: 572px; border-radius: 22px;
  background-color: var(--board);
  background-image: linear-gradient(var(--grid) 1.5px, transparent 1.5px), linear-gradient(90deg, var(--grid) 1.5px, transparent 1.5px);
  background-size: 40px 40px; background-position: -1px -1px;
  border: 2px solid var(--edge);
}
.axis { position: absolute; top: 9px; font-size: 15px; font-weight: 700; letter-spacing: 1.6px; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.axis.l { left: 18px; } .axis.r { right: 18px; }
.axis i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.axis.l i { background: var(--energy-lo); border: 2px solid var(--energy-hi); }
.axis.r i { background: var(--energy-hi); }
.line {
  position: absolute; left: 28px; width: 1524px; top: 365px; height: 14px; border-radius: 7px;
  background: linear-gradient(90deg, var(--energy-lo), var(--energy-hi));
}
.line::after {
  content: ""; position: absolute; right: -26px; top: -11px; border-left: 30px solid var(--energy-hi);
  border-top: 18px solid transparent; border-bottom: 18px solid transparent;
}

#marks, #layer { position: absolute; inset: 0; pointer-events: none; }
.stem { position: absolute; left: 0; top: 0; width: 3px; height: 46px; background: var(--ink); opacity: .55; border-radius: 2px; }
.dot { position: absolute; left: 0; top: 0; width: 18px; height: 18px; border-radius: 50%; background: var(--card); border: 3px solid var(--ink); box-sizing: border-box; }
.stem, .dot, .pillpos, .ghost { transition: transform .45s cubic-bezier(.2, .8, .2, 1), opacity .3s; }
.pillpos { position: absolute; left: 0; top: 0; }
.pill {
  transform: translate(-50%, -50%) scale(var(--pk, 1)); white-space: nowrap;
  background: var(--card); border: 2.5px solid var(--ink); border-radius: 9px; padding: 2px 9px 3px;
  font-size: 13px; font-weight: 700; color: var(--ink); box-shadow: 0 2px 0 var(--shadow);
  font-variant-numeric: tabular-nums;
}
.pill b { font-family: var(--font-display); font-size: 21px; font-weight: 800; color: var(--accent); }
.pop { animation: pop .5s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes pop { from { opacity: 0; transform: translate(-50%, -50%) scale(.3); } }

/* ---------- cards ---------- */
.card {
  position: absolute; left: 0; top: 0; width: 150px; height: 206px; transform-origin: 0 0;
  pointer-events: auto; cursor: pointer;
  transition: transform .45s cubic-bezier(.2, .8, .2, 1), width .45s cubic-bezier(.2, .8, .2, 1), height .45s cubic-bezier(.2, .8, .2, 1);
}
.card.can { cursor: grab; }
.face {
  position: absolute; inset: 0; background: var(--card); border: 2px solid var(--edge); border-radius: 16px;
  box-shadow: 0 3px 0 var(--edge), 0 8px 18px -10px var(--shadow);
  display: flex; flex-direction: column; align-items: center; padding: 7px 7px 9px; box-sizing: border-box; gap: 5px;
  transition: border-color .3s, box-shadow .2s, background-color .3s;
}
.face .img { width: 100%; height: 94px; flex: none; border-radius: 11px; background: var(--plate); display: grid; place-items: center; }
.face img { width: 80px; height: 80px; pointer-events: none; -webkit-user-drag: none; }
.face .name { font-weight: 700; font-size: 16.5px; line-height: 1.12; text-align: center; text-wrap: balance; hyphens: auto; -webkit-hyphens: auto; overflow-wrap: break-word; max-width: 100%; }
.face .portion { margin-top: auto; font-size: 13px; line-height: 1.18; text-align: center; color: var(--muted); text-wrap: balance; }
.card.compact .portion { display: none; }
.card.compact .face { padding: 6px 5px 8px; gap: 6px; }
.card.compact .face .img { height: 86px; }
.card.compact .face img { width: 74px; height: 74px; }
.card.compact .face .name { font-size: 15.5px; }
.card.dragging { cursor: grabbing; z-index: 50; transition: none; }
.card.dragging .face { box-shadow: 0 22px 40px -12px var(--shadow); transform: rotate(-3deg); }
.card.mine .face { border-color: var(--team); border-width: 4px; box-shadow: 0 0 0 4px color-mix(in srgb, var(--team) 25%, transparent), 0 8px 18px -10px var(--shadow); }
.card.focus .face { box-shadow: 0 0 0 6px color-mix(in srgb, var(--energy-hi) 45%, transparent), 0 8px 18px -10px var(--shadow); border-color: var(--energy-hi); }
.card.flip .face { animation: flip .5s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes flip { from { transform: perspective(700px) rotateY(90deg) scale(.9); } }
.owner {
  position: absolute; left: -11px; top: -11px; width: 32px; height: 32px; border-radius: 50%; z-index: 2;
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 17px;
  background: var(--team); color: var(--team-fg); border: 3px solid var(--board);
}
.badge {
  position: absolute; right: -11px; top: -11px; min-width: 36px; height: 34px; border-radius: 17px; z-index: 2; box-sizing: border-box; padding: 0 7px;
  display: grid; place-items: center; color: #fff; font-family: var(--font-display); font-size: 19px; font-weight: 800; border: 3px solid var(--board);
}
.badge.ok { background: var(--right); } .badge.no { background: var(--wrong); }
.badge.p2 { background: var(--right); } .badge.p1 { background: var(--gold); } .badge.p0 { background: var(--muted); }
.dge {
  position: absolute; left: -2px; right: -2px; bottom: -2px; height: 34px; border-radius: 0 0 16px 16px;
  display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 14.5px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden;
}
.dge.good { background: var(--good); } .dge.bad { background: var(--bad); }
.card.dge-good .face { border-color: var(--good); background: var(--good-soft); }
.card.dge-bad .face { border-color: var(--bad); background: var(--bad-soft); }

.ghost {
  position: absolute; left: 0; top: 0; width: 150px; height: 206px; transform-origin: 0 0; box-sizing: border-box;
  border: 3px dashed var(--energy-hi); border-radius: 16px; background: color-mix(in srgb, var(--energy-lo) 35%, transparent);
}
.gdot { position: absolute; left: 0; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--energy-hi); box-shadow: 0 0 0 6px color-mix(in srgb, var(--energy-hi) 25%, transparent); }

/* anchor */
.anchor { position: absolute; left: 702px; top: 241px; width: 196px; height: 262px; pointer-events: auto; cursor: pointer; }
.anchor .face { border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink), 0 14px 28px -12px var(--shadow); padding: 9px 9px 10px; gap: 4px; }
.anchor .img { height: 104px; }
.anchor img { width: 92px; height: 92px; }
.anchor .name { font-family: var(--font-display); font-size: 22px; font-weight: 800; }
.anchor .portion { margin-top: 0; font-size: 13px; }
.anchor .kc { margin-top: auto; font-family: var(--font-display); font-weight: 800; font-size: 30px; color: var(--accent); line-height: 1; font-variant-numeric: tabular-nums; }
.anchor .kc span { font-size: 17px; }
.tab {
  position: absolute; left: 50%; top: -17px; transform: translateX(-50%); background: var(--ink); color: var(--board);
  font-size: 13px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; padding: 5px 12px; border-radius: 99px; white-space: nowrap;
}

/* ---------- dock: turn panel ---------- */
.turn { position: absolute; left: 20px; top: 664px; width: 590px; height: 226px; display: flex; flex-direction: column; gap: 9px; }
.turn h2, .score h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; }
.turnhead { display: flex; align-items: center; gap: 14px; }
.gbig {
  width: 60px; height: 60px; border-radius: 50%; flex: none; display: grid; place-items: center;
  font-family: var(--font-display); font-weight: 800; font-size: 32px; background: var(--team); color: var(--team-fg);
  box-shadow: 0 4px 0 color-mix(in srgb, var(--team) 55%, var(--ink));
}
.gname { font-family: var(--font-display); font-weight: 800; font-size: 30px; line-height: 1.05; }
.round { color: var(--muted); font-size: 16px; margin-top: 3px; font-variant-numeric: tabular-nums; }
.timer { margin-left: auto; width: 84px; height: 84px; position: relative; flex: none; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer circle { fill: none; stroke-width: 10; }
.timer .track { stroke: var(--plate); }
.timer .ring { stroke: var(--energy-hi); stroke-linecap: round; transition: stroke-dashoffset .2s linear, stroke .2s; }
.timer .sec { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 32px; font-variant-numeric: tabular-nums; }
.timer.idle { opacity: .45; }
.timer.warn .ring { stroke: var(--wrong); }
.timer.warn .sec { color: var(--wrong); animation: beat 1s infinite; }
@keyframes beat { 50% { transform: scale(1.15); } }
.roles { display: flex; gap: 6px; flex-wrap: wrap; font-size: 15px; }
.roles span { background: var(--plate); border-radius: 8px; padding: 4px 9px; }
.action { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 18px; line-height: 1.3; }
.action p { margin: 0; flex: 1 1 260px; }
.action .late { color: var(--wrong); font-weight: 700; }
.picks { display: flex; gap: 7px; flex-wrap: wrap; }
.pick {
  width: 42px; height: 42px; border-radius: 50%; border: 3px solid var(--board); background: var(--team); color: var(--team-fg);
  font-family: var(--font-display); font-weight: 800; font-size: 19px; display: grid; place-items: center; padding: 0;
  box-shadow: 0 3px 0 color-mix(in srgb, var(--team) 55%, var(--ink));
}
.setrow { display: flex; align-items: center; gap: 10px; font-size: 18px; }
.setrow > span:first-child { width: 150px; font-weight: 700; }
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.stepper button { width: 42px; height: 42px; border-radius: 12px; border: 2px solid var(--edge); background: var(--card); font-size: 24px; font-weight: 700; line-height: 1; }
.stepper b { width: 54px; text-align: center; font-family: var(--font-display); font-size: 28px; font-variant-numeric: tabular-nums; }
.seg { display: inline-flex; gap: 6px; }
.seg button { border: 2px solid var(--edge); background: var(--card); border-radius: 10px; padding: 7px 12px; font-size: 16px; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--board); border-color: var(--ink); }
.rank { display: grid; gap: 4px; font-size: 18px; }
.rank div { display: flex; align-items: center; gap: 8px; }
.mini {
  width: 28px; height: 28px; border-radius: 50%; display: inline-grid; place-items: center; flex: none;
  background: var(--team); color: var(--team-fg); font-family: var(--font-display); font-weight: 800; font-size: 15px;
}
.legend { display: flex; gap: 10px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px; font-weight: 700; font-size: 15px; color: #fff; }
.chip.good { background: var(--good); } .chip.bad { background: var(--bad); }

/* deck + slot */
.deck { position: absolute; left: 636px; top: 676px; width: 150px; height: 206px; padding: 0; border: 0; background: none; border-radius: 16px; }
.deck .back {
  position: absolute; inset: 0; border-radius: 16px; border: 2px solid var(--energy-hi);
  background: repeating-linear-gradient(135deg, var(--back-a) 0 12px, var(--back-b) 12px 24px);
  box-shadow: 0 3px 0 var(--energy-hi);
}
.deck .back.b2 { transform: translate(7px, -6px) rotate(3deg); opacity: .7; }
.deck .back.b3 { transform: translate(-6px, -4px) rotate(-3deg); opacity: .5; }
.deck .back.top { display: grid; place-items: center; align-content: center; gap: 2px; transition: transform .2s; }
.deck .q { width: 84px; height: 84px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 54px; color: var(--energy-hi); border: 3px solid var(--energy-hi); }
.deck .lbl { margin-top: 10px; background: var(--card); color: var(--ink); font-weight: 700; font-size: 15px; padding: 4px 10px; border-radius: 8px; }
.deck .count {
  position: absolute; right: -12px; top: -14px; min-width: 38px; height: 38px; border-radius: 19px; background: var(--ink); color: var(--board);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 20px; padding: 0 6px; box-sizing: border-box; z-index: 2;
}
.deck:not(:disabled):hover .back.top { transform: translateY(-4px); }
.deck:not(:disabled) .back.top { animation: nudge 2.2s ease-in-out infinite; }
@keyframes nudge { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-6px) rotate(-2deg); } 90% { transform: translateY(-2px) rotate(1deg); } }
.deck:disabled { cursor: default; }
.deck:disabled .back { filter: grayscale(.7); opacity: .55; }
.deck.empty .back, .deck.empty .count { display: none; }
.deck.empty::after { content: "Stapel leer"; position: absolute; inset: 0; border: 3px dashed var(--edge); border-radius: 16px; display: grid; place-items: center; color: var(--muted); font-weight: 700; }
.slot {
  position: absolute; left: 818px; top: 676px; width: 150px; height: 206px; box-sizing: border-box;
  border: 3px dashed var(--edge); border-radius: 16px; display: grid; place-items: center; text-align: center;
  color: var(--muted); font-size: 15px; font-weight: 700; padding: 14px;
}

/* score panel */
.score { position: absolute; left: 998px; top: 664px; width: 586px; height: 226px; display: flex; flex-direction: column; gap: 9px; }
.score .head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.score .head span { font-size: 13.5px; color: var(--muted); }
.chips { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; }
.sc {
  display: flex; align-items: center; gap: 6px; padding: 4px 9px 4px 5px; border: 2px solid var(--edge); border-radius: 12px; background: var(--card);
  height: 44px; box-sizing: border-box; position: relative; transition: transform .2s;
}
.sc b { margin-left: auto; font-family: var(--font-display); font-weight: 800; font-size: 24px; font-variant-numeric: tabular-nums; }
.sc.now { border-color: var(--team); box-shadow: 0 3px 0 var(--team); transform: translateY(-2px); }
.sc.lead { border-color: var(--gold); box-shadow: 0 3px 0 var(--gold); }
.sc.lead::after { content: "★"; position: absolute; top: -13px; right: -6px; color: var(--gold); font-size: 22px; line-height: 1; }
.sc.bump b { animation: bump .5s; }
@keyframes bump { 40% { transform: scale(1.4); color: var(--energy-hi); } }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: auto; }
.step {
  border: 2px solid var(--edge); background: var(--card); border-radius: 12px; padding: 9px 8px; font-size: 16px; font-weight: 700;
  display: flex; align-items: center; gap: 8px; text-align: left; line-height: 1.15;
}
.step .n { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--plate); font-size: 15px; }
.step.next { border-color: var(--energy-hi); box-shadow: 0 3px 0 var(--energy-hi); }
.step.next .n { background: var(--energy-hi); color: #fff; }
.step.done { opacity: .6; }
.step.done .n { background: var(--ink); color: var(--board); }
.step:disabled { cursor: not-allowed; }
.step:disabled:not(.done) { opacity: .4; }
.credit { position: absolute; right: 18px; bottom: 2px; font-size: 11px; color: var(--muted); }

/* ---------- overlays ---------- */
.overlay { position: absolute; inset: 0; background: var(--overlay); display: grid; place-items: center; z-index: 100; animation: fade .2s; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  background: var(--card); color: var(--ink); border-radius: 22px; padding: 30px 34px; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45);
  border: 3px solid var(--ink); position: relative; animation: rise .3s cubic-bezier(.2, .8, .2, 1);
}
@keyframes rise { from { transform: translateY(18px) scale(.97); } }
.detail { width: 740px; display: grid; grid-template-columns: 230px 1fr; gap: 28px; align-items: start; }
.detail .bigimg { width: 230px; height: 230px; border-radius: 18px; background: var(--plate); display: grid; place-items: center; }
.detail .bigimg img { width: 190px; height: 190px; }
.detail h3 { margin: 4px 50px 6px 0; font-family: var(--font-display); font-weight: 800; font-size: 38px; line-height: 1.05; text-wrap: balance; }
.detail .por { font-size: 20px; color: var(--muted); margin: 0 0 14px; }

function newGame() {
  state = {

const fits = (a, b) => a <= b + TOL; // a darf links von b liegen
function sideOk(id) {
  const k = BY[id].kcal;
  if (Math.abs(k - ANCHOR.kcal) <= TOL) return true;
  return state.L.includes(id) === (k < ANCHOR.kcal);

function chainSet() {
  const set = new Set();

  if (kind === "tick") tone(880, .09);
  else if (kind === "buzz") { tone(196, .55, .14, "square"); tone(147, .55, .1, "square"); }
  else if (kind === "good") { tone(660, .14, .12, "triangle"); tone(990, .2, .12, "triangle", .12); }
  else if (kind === "fanfare") [523, 659, 784, 1047].forEach((f, i) => tone(f, .28, .13, "triangle", i * .14));
}
$("#btn-sound").onclick = () => {
  soundOn = !soundOn; ensureAudio();
  $("#btn-sound").setAttribute("aria-pressed", soundOn); $("#snd-label").textContent = soundOn ? "Ton an" : "Ton aus";
  $("#snd-wave").style.opacity = soundOn ? 1 : 0;
};

// ---------- pointer / drag ----------
const canDrag = id => state.step === 0 && ((state.phase === "place" && id === state.active) || (state.phase === "objmove" && id === state.contested));
function toStage(e) { const r = stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / scale, y: (e.clientY - r.top) / scale }; }
function onDown(e, id) {
  if (drag || e.button > 0) return;
  wake(); ensureAudio();
  const p = toStage(e), card = els[id].card;
  const m = new DOMMatrixReadOnly(getComputedStyle(card).transform);
  const k = m.a || 1, w = card.offsetWidth * k, h = card.offsetHeight * k;
  drag = { id, start: p, moved: false, fx: (p.x - m.e) / w, fy: (p.y - m.f) / h, pid: e.pointerId, origin: null };
  card.setPointerCapture(e.pointerId);
  card.addEventListener("pointermove", onMove);
  card.addEventListener("pointerup", onUp);
  card.addEventListener("pointercancel", onCancel);
}
function onMove(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const p = toStage(e);
  if (!drag.moved) {
    if (Math.hypot(p.x - drag.start.x, p.y - drag.start.y) < 8 || !canDrag(drag.id)) return;
    drag.moved = true;
    for (const side of ["L", "R"]) { const i = state[side].indexOf(drag.id); if (i >= 0) { drag.origin = { side, index: i }; state[side].splice(i, 1); } }
    if (!drag.origin) drag.origin = { slot: true };
    els[drag.id].card.classList.add("dragging");
  }
  putCard(els[drag.id].card, p.x - drag.fx * CW, p.y - drag.fy * CH, FULL);
  const np = targetAt(p);
  if (JSON.stringify(np) !== JSON.stringify(preview)) { preview = np; render(); }
}
function targetAt(p) {
  if (p.y < BOARD_TOP || p.y > BOARD_BOTTOM || p.x < 16 || p.x > W - 16) return null;
  const side = p.x < CENTER ? "L" : "R";
  const { xs } = sideLayout(side, state[side].length + 1);
  let best = 0, bd = Infinity;
  xs.forEach((x, i) => { const d = Math.abs(x - p.x); if (d < bd) { bd = d; best = i; } });
  return { side, index: best };
}
function endDrag() {
  const e = drag && els[drag.id];
  if (!e) return;
  e.card.classList.remove("dragging");
  e.card.removeEventListener("pointermove", onMove);
  e.card.removeEventListener("pointerup", onUp);
  e.card.removeEventListener("pointercancel", onCancel);
}
function onUp(e) {
  if (!drag || e.pointerId !== drag.pid) return;
  const d = drag; endDrag();
  if (!d.moved) { drag = null; openDetail(d.id); return; }
  let late = false;
  if (preview) {
    state[preview.side].splice(preview.index, 0, d.id);
    late = !!(d.origin && d.origin.slot);
  } else if (d.origin && !d.origin.slot) {
    state[d.origin.side].splice(d.origin.index, 0, d.id);
  }
  preview = null; drag = null;
  // Zeit abgelaufen: Karte zählt, sobald sie an der Linie liegt (aus dem Ablagefeld = zu spät)
  if (state.phase === "place" && state.timeOut && onLine(d.id)) commit(late); else render();
}
function onCancel() {
  if (!drag) return;
  const d = drag; endDrag();
  if (d.moved && d.origin && !d.origin.slot) state[d.origin.side].splice(d.origin.index, 0, d.id);
  preview = null; drag = null; render();
}

// ---------- overlays ----------
function overlay(inner, cls) {
  host.innerHTML = `<div class="overlay"><div class="sheet ${cls}" role="dialog" aria-modal="true">${inner}</div></div>`;
  const ov = host.firstChild;
  ov.addEventListener("pointerdown", e => { if (e.target === ov) closeOverlay(); });
  const x = ov.querySelector(".close"); if (x) { x.onclick = closeOverlay; x.focus(); }
  return ov;
}
function closeOverlay() { host.innerHTML = ""; }
document.addEventListener("keydown", e => { if (e.key === "Escape") closeOverlay(); });

function openDetail(id) {
  const isAnchor = id === "kaese";
  const f = isAnchor ? ANCHOR : BY[id];
  const showKcal = isAnchor || state.step >= 1 || state.revealed.includes(id);
  const owner = state.owner[id];
  let ptsTxt = "";
  if (!isAnchor && state.cardPts && id in state.cardPts) {
    const p = state.cardPts[id];
    const why = state.late.includes(id) ? "zu spät gelegt" : state.forfeit.includes(id) ? "der Einspruch war berechtigt"
      : p === 2 ? "richtige Seite und richtige Reihenfolge" : p === 1 ? "richtige Seite, aber falsche Reihenfolge" : "falsche Seite vom Käsebrötchen";
    ptsTxt = ` - <b>${p} ${p === 1 ? "Punkt" : "Punkte"}</b> (${why})`;
  }
  overlay(`
    <button class="close" type="button" aria-label="Schließen">×</button>
    <div class="bigimg"><img alt="" src="${src(id)}"></div>
    <div>
      <h3>${f.name}</h3>
      <p class="por">${f.portion}</p>
      ${showKcal ? `<div class="kcal">ca. ${f.kcal} <span>kcal</span></div><p class="calc">${f.calc}</p>`
                 : `<div class="wait">Die Kalorien sehen Sie bei der Auflösung.</div>`}
      ${isAnchor ? `<p class="calc muted">Das Käsebrötchen liegt fest in der Mitte. Es hilft beim Schätzen.</p>` : ""}
      ${owner ? `<div class="who"><span class="mini" style="${teamVars(owner)}">${owner}</span><span>Gelegt von Gruppe ${owner}${ptsTxt}</span></div>` : ""}
      ${!isAnchor && state.step >= 3 ? `<div class="why ${f.dge ? "good" : "bad"}"><span class="chip ${f.dge ? "good" : "bad"}">${f.dge ? "✓ passt zur vollwertigen Ernährung" : "✗ eher nicht"}</span><br>${f.why}</div>` : ""}
    </div>`, "detail");
}
function confirmBox(title, text, yes, onYes, no) {
  const ov = overlay(`<h3 class="t">${title}</h3><p>${text}</p><div class="row"><button class="btn" type="button" data-no>${no}</button><button class="btn primary" type="button" data-yes>${yes}</button></div>`, "confirm");
  ov.querySelector("[data-no]").onclick = closeOverlay;
  ov.querySelector("[data-yes]").onclick = () => { closeOverlay(); onYes(); };
  ov.querySelector("[data-yes]").focus();
}
function showMerk() {
  overlay(`<button class="close" type="button" aria-label="Schließen">×</button>
    <div class="eyebrow">Merksatz</div>
    <p>Wenige Kalorien heißt nicht automatisch gesund. Viele Kalorien heißt nicht automatisch ungesund.</p>
    <p class="small">Wichtig ist, was im Lebensmittel steckt: Vitamine, Ballaststoffe und Eiweiß - oder vor allem Zucker, Fett und Salz.</p>`, "merk");
}
function showRules() {
  const t = state ? state.secs : settings.secs;
  overlay(`<button class="close" type="button" aria-label="Schließen">×</button>
    <h3 class="t">Spielregeln</h3>
    <ol>
      <li><span>Die Gruppen sind <b>der Reihe nach</b> dran. Tippen Sie auf den Stapel: Eine Karte wird aufgedeckt.</span></li>
      <li><span>Sie haben <b>${t} Sekunden</b>. Ziehen Sie die Karte an die Linie und tippen Sie auf „Fertig“. Weniger Kalorien als das Käsebrötchen: links. Mehr: rechts.</span></li>
      <li><span>Jede Person hat eine <b>Rolle</b>: Karte legen, laut begründen, auf die Zeit achten. Die Rollen wechseln jede Runde.</span></li>
      <li><span><b>Einspruch!</b> Liegt die Karte einer anderen Gruppe falsch? Rufen Sie „Einspruch!“ und begründen Sie. Haben Sie recht: +1 Punkt für Ihre Gruppe, und Sie legen die Karte richtig hin. Haben Sie nicht recht: +1 Punkt für die andere Gruppe.</span></li>
      <li><span>Bei der Auflösung gibt es für jede Karte Punkte: <b>+1</b> für die richtige Seite vom Käsebrötchen, <b>+1</b> für die richtige Reihenfolge.</span></li>
      <li><span>Zu spät gelegt: 0 Punkte für diese Karte. Bis 20 kcal Unterschied gelten zwei Lebensmittel als gleich.</span></li>
    </ol>`, "rules");
}
function showPodium() {
  const pl = rankList(3);
  const col = (i, cls) => pl[i] ? `<div class="pcol ${cls}"><div class="pteams">${pl[i].gs.map(x => `<span class="mini" style="${teamVars(x)}">${x}</span>`).join("")}</div><div class="ppts">${pl[i].p} ${pl[i].p === 1 ? "Punkt" : "Punkte"}</div><div class="block">${i + 1}</div></div>` : `<div class="pcol"></div>`;
  overlay(`<button class="close" type="button" aria-label="Schließen">×</button>
    <div class="eyebrow">Siegerehrung</div>
    <h3 class="t">${pl[0].gs.length > 1 ? "Gleichstand auf Platz 1!" : `Gruppe ${pl[0].gs[0]} gewinnt!`}</h3>
    <div class="pod">${col(1, "p2")}${col(0, "p1")}${col(2, "p3")}</div>`, "podium");
  sound("fanfare");
}

$("#anchor").addEventListener("click", () => openDetail("kaese"));
$("#anchor").addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openDetail("kaese"); } });
$("#btn-rules").onclick = showRules;
$("#btn-new").onclick = () => {
  if (state.phase === "setup") return;
  confirmBox("Neues Spiel starten?", "Alle Karten kommen zurück in den Stapel und die Punkte werden gelöscht.", "Neues Spiel", reset, "Abbrechen");
};
function reset() {
  stopTimer(); newGame();
  FOODS.forEach(f => { const e = els[f.id]; e.card.hidden = true; e.pp.hidden = true; });
  render();
}

// ---------- fullscreen, wake lock ----------
const fullBtn = $("#btn-full");
if (!document.fullscreenEnabled) fullBtn.hidden = true;
fullBtn.onclick = () => {
  try {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else document.documentElement.requestFullscreen().catch(() => { fullBtn.hidden = true; });
  } catch (_) { fullBtn.hidden = true; }
};
document.addEventListener("fullscreenchange", () => { $("#full-label").textContent = document.fullscreenElement ? "Vollbild beenden" : "Vollbild"; setTimeout(fit, 60); });
let lock = null;
function wake() {
  if (lock || !("wakeLock" in navigator)) return;
  navigator.wakeLock.request("screen").then(l => { lock = l; l.addEventListener("release", () => { lock = null; }); }).catch(() => {});
}

// ---------- fit stage to screen ----------
function fit() {
  const r = wrap.getBoundingClientRect();
  scale = Math.min(r.width / W, r.height / H) || 1;
  stage.style.transform = `translate(${(r.width - W * scale) / 2}px, ${(r.height - H * scale) / 2}px) scale(${scale})`;
}
window.addEventListener("resize", fit);

// ---------- keep the game across page updates ----------
const hot = window.claude && window.claude.hot;
if (hot && hot.snapshot) { try { hot.snapshot(() => JSON.parse(JSON.stringify({ state, settings }))); } catch (_) {} }
function start(data) {
  buildCards();
  if (data && data.state && data.state.order && data.state.order.length === TOTAL) {
    state = data.state; settings = data.settings || settings;
    if (state.phase === "place") { state.deadline = null; state.timeOut = true; }
  } else newGame();
  fit();
  FOODS.forEach(f => { els[f.id].card.style.transition = "none"; });
  render();
  requestAnimationFrame(() => FOODS.forEach(f => { els[f.id].card.style.transition = ""; }));
}
if (hot && hot.ready) hot.ready(start); else start((hot && hot.data) || {});
})();
</script>
